name: Go Cache S3 Test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  test-cache:
    runs-on: [qiniu, ubuntu-22.04]
    env:
      GOPATH: /home/runner/go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner environment
        run: |
          echo "ACTIONS_RESULTS_URL=${ACTIONS_RESULTS_URL:-<not set>}"
          echo "ACTIONS_CACHE_SERVICE_V2=${ACTIONS_CACHE_SERVICE_V2:-<not set>}"
          echo "RUNS_ON_S3_BUCKET_CACHE=${RUNS_ON_S3_BUCKET_CACHE:-<not set>}"
          echo "RUNS_ON_AWS_REGION=${RUNS_ON_AWS_REGION:-<not set>}"
          echo "RUNS_ON_S3_BUCKET_ENDPOINT=${RUNS_ON_S3_BUCKET_ENDPOINT:-<not set>}"
          echo "RUNS_ON_S3_CACHE_READ_PREFIXES=${RUNS_ON_S3_CACHE_READ_PREFIXES:-<not set>}"
          echo "RUNS_ON_S3_CACHE_WRITE_PREFIX=${RUNS_ON_S3_CACHE_WRITE_PREFIX:-<not set>}"
          echo "AWS_ACCESS_KEY_ID length=${#AWS_ACCESS_KEY_ID}"
          echo "AWS_SESSION_TOKEN length=${#AWS_SESSION_TOKEN}"
          echo "RUNS_ON_S3_ACCESS_KEY_ID length=${#RUNS_ON_S3_ACCESS_KEY_ID}"
          echo "RUNS_ON_S3_SESSION_TOKEN length=${#RUNS_ON_S3_SESSION_TOKEN}"
          echo "Runner labels: $(uname -a)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Cache Go modules (S3 direct)
        id: cache
        uses: qiniu/actions-cache@57e05e73d6239d30c0494473d49069a194236d84
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Go module download
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Run
        run: ./ci-runner-test
