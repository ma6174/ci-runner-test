name: Cache S3 1GB Speed Test (runs-on/cache)

on:
  workflow_dispatch:

# Use one fixed key per workflow run. The upload job saves it first, and the
# download job restores the same object in a fresh sandbox.
env:
  CACHE_KEY: cache-speed-1gb-${{ github.run_id }}

jobs:
  upload:
    runs-on: [qiniu, ubuntu-22.04]
    steps:
      - name: Show cache endpoint
        run: |
          echo "bucket=$RUNS_ON_S3_BUCKET_CACHE"
          echo "region=$RUNS_ON_AWS_REGION"
          echo "endpoint=$RUNS_ON_S3_BUCKET_ENDPOINT"
          echo "prefix=$RUNS_ON_S3_CACHE_REPO_PREFIX"
          echo "upload_queue=${UPLOAD_QUEUE_SIZE:-default} upload_part_mib=${UPLOAD_PART_SIZE:-default}"
          echo "download_queue=${DOWNLOAD_QUEUE_SIZE:-default} download_part_mib=${DOWNLOAD_PART_SIZE:-default}"

      - name: Generate 1 GiB incompressible payload
        run: |
          set -euo pipefail
          mkdir -p /tmp/cache-speed
          echo "Generating 1 GiB payload (not included in transfer timing)..."
          dd if=/dev/urandom of=/tmp/cache-speed/payload.bin bs=1M count=1024 status=progress
          stat -c 'payload_bytes=%s' /tmp/cache-speed/payload.bin

      - name: Cache upload (runs-on/cache multipart and concurrent)
        id: cache-upload
        uses: runs-on/cache@v5
        with:
          path: /tmp/cache-speed/payload.bin
          key: ${{ env.CACHE_KEY }}

      - name: Wait for cache post-step
        run: |
          echo "The runs-on/cache post step uploads the archive after this step."
          date -u +%Y-%m-%dT%H:%M:%SZ

  download:
    needs: upload
    runs-on: [qiniu, ubuntu-22.04]
    steps:
      - name: Show cache endpoint
        run: |
          echo "upload_queue=${UPLOAD_QUEUE_SIZE:-default} download_queue=${DOWNLOAD_QUEUE_SIZE:-default}"
          echo "upload_part_mib=${UPLOAD_PART_SIZE:-default} download_part_mib=${DOWNLOAD_PART_SIZE:-default}"

      - name: Cache download (runs-on/cache concurrent range requests)
        id: cache-download
        uses: runs-on/cache@v5
        with:
          path: /tmp/cache-speed/payload.bin
          key: ${{ env.CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Verify restored payload
        run: |
          set -euo pipefail
          stat -c 'restored_bytes=%s' /tmp/cache-speed/payload.bin
          test "$(stat -c %s /tmp/cache-speed/payload.bin)" -eq 1073741824
          sha256sum /tmp/cache-speed/payload.bin
